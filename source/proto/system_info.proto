syntax = "proto3";

option optimize_for = LITE_RUNTIME;

package proto.system_info;

message Computer
{
    string name      = 1;
    string domain    = 2;
    string workgroup = 3;
    uint64 uptime    = 4;
}

message OperatingSystem
{
    string name        = 1;
    string version     = 2;
    string arch        = 3;
    string key         = 4;
    int64 install_date = 5;
}

message Processor
{
    string vendor   = 1;
    string model    = 2;
    uint32 packages = 3;
    uint32 cores    = 4;
    uint32 threads  = 5;
}

message LogicalDrives
{
    message Drive
    {
        string path        = 1;
        string file_system = 2;
        uint64 total_size  = 3;
        uint64 free_size   = 4;
    }

    repeated Drive drive = 1;
}

message PhysicalDrives
{
    message Drive
    {
        enum BusType
        {
            BUS_TYPE_UNKNOWN             = 0;
            BUS_TYPE_SCSI                = 1;
            BUS_TYPE_ATAPI               = 2;
            BUS_TYPE_ATA                 = 3;
            BUS_TYPE_IEEE1394            = 4;
            BUS_TYPE_SSA                 = 5;
            BUS_TYPE_FIBRE               = 6;
            BUS_TYPE_USB                 = 7;
            BUS_TYPE_RAID                = 8;
            BUS_TYPE_ISCSI               = 9;
            BUS_TYPE_SAS                 = 10;
            BUS_TYPE_SATA                = 11;
            BUS_TYPE_SD                  = 12;
            BUS_TYPE_MMC                 = 13;
            BUS_TYPE_VIRTUAL             = 14;
            BUS_TYPE_FILE_BACKED_VIRTUAL = 15;
            BUS_TYPE_NVME                = 16;
            BUS_TYPE_SPACES              = 17;
            BUS_TYPE_SCM                 = 18;
            BUS_TYPE_UFS                 = 19;
            BUS_TYPE_NVME_OF             = 20;
        }

        enum MediaType
        {
            MEDIA_TYPE_UNKNOWN     = 0;
            MEDIA_TYPE_ROTATING    = 1;
            MEDIA_TYPE_SOLID_STATE = 2;
        }

        // Health data of an ATA drive. The meaning of an attribute depends on its id and on the
        // drive model, so the names are resolved on the client side.
        message SmartAttribute
        {
            uint32 id           = 1;
            uint32 status_flags = 2;
            uint32 value        = 3;
            uint32 worst_value  = 4;
            uint32 threshold    = 5;
            uint64 raw          = 6;
        }

        // Health data of an NVMe drive. Temperatures are in Kelvin, times in minutes and a data
        // unit is 1000 blocks of 512 bytes.
        message NvmeHealth
        {
            uint32 critical_warning            = 1;
            uint32 composite_temperature       = 2;
            repeated uint32 temperature_sensor = 3;
            uint32 available_spare             = 4;
            uint32 available_spare_threshold   = 5;
            uint32 percentage_used             = 6;
            uint64 data_units_read             = 7;
            uint64 data_units_written          = 8;
            uint64 host_read_commands          = 9;
            uint64 host_write_commands         = 10;
            uint64 controller_busy_time        = 11;
            uint64 power_cycles                = 12;
            uint64 power_on_hours              = 13;
            uint64 unsafe_shutdowns            = 14;
            uint64 media_errors                = 15;
            uint64 error_log_entries           = 16;
            uint32 warning_temperature_time    = 17;
            uint32 critical_temperature_time   = 18;
        }

        string path              = 1;
        string model             = 2;
        string serial_number     = 3;
        string firmware_revision = 4;
        BusType bus_type         = 5;
        uint64 size              = 6;
        uint32 rotation_rate     = 7;
        uint32 buffer_size       = 8;
        bool removable           = 9;
        MediaType media_type     = 10;

        repeated SmartAttribute smart_attribute = 11;
        NvmeHealth nvme_health                  = 12;
    }

    repeated Drive drive = 1;
}

message Printers
{
    message Printer
    {
        string name       = 1;
        bool is_default   = 2;
        bool is_shared    = 3;
        string port       = 4;
        string driver     = 5;
        uint32 jobs_count = 6;
        string share_name = 7;
    }

    repeated Printer printer = 1;
}

message NetworkAdapters
{
    message Adapter
    {
        message Address
        {
            string ip   = 1;
            string mask = 2;
        }

        string adapter_name      = 1;
        string connection_name   = 2;
        string iface             = 3;
        uint64 speed             = 4;
        string mac               = 5;
        bool dhcp_enabled        = 6;
        repeated string gateway  = 7;
        repeated Address address = 8;
        repeated string dns      = 9;
        repeated string dhcp     = 10;
    }

    repeated Adapter adapter = 1;
}

message NetworkShares
{
    message Share
    {
        string name         = 1;
        string description  = 2;
        string type         = 3;
        string local_path   = 4;
        uint32 current_uses = 5;
        uint32 max_uses     = 6;
    }

    repeated Share share = 1;
}

message WindowsDevices
{
    message Device
    {
        string friendly_name = 1;
        string description   = 2;
        string driver_vendor = 3;
        string device_id     = 4;
    }

    repeated Device device = 1;
}

message VideoAdapters
{
    message Adapter
    {
        string description     = 1;
        string adapter_string  = 2;
        string bios_string     = 3;
        string chip_type       = 4;
        string dac_type        = 5;
        string driver_date     = 6;
        string driver_version  = 7;
        string driver_provider = 8;
        uint64 memory_size     = 9;
    }

    repeated Adapter adapter = 1;
}

message Monitors
{
    message Monitor
    {
        enum InputSignalType
        {
            INPUT_SIGNAL_TYPE_UNKNOWN = 0;
            INPUT_SIGNAL_TYPE_ANALOG  = 1;
            INPUT_SIGNAL_TYPE_DIGITAL = 2;
        }

        message Timing
        {
            int32 width     = 1;
            int32 height    = 2;
            int32 frequency = 3;
        }

        string system_name                   = 1;
        string monitor_name                  = 2;
        string manufacturer_name             = 3;
        string monitor_id                    = 4;
        string serial_number                 = 5;
        int32 edid_version                   = 6;
        int32 edid_revision                  = 7;
        int32 week_of_manufacture            = 8;
        int32 year_of_manufacture            = 9;
        int32 max_horizontal_image_size      = 10;
        int32 max_vertical_image_size        = 11;
        int32 horizontal_resolution          = 12;
        int32 vertical_resoulution           = 13;
        double gamma                         = 14;
        int32 min_horizontal_rate            = 15;
        int32 max_horizontal_rate            = 16;
        int32 min_vertical_rate              = 17;
        int32 max_vertical_rate              = 18;
        double pixel_clock                   = 19;
        int32 max_pixel_clock                = 20;
        InputSignalType input_signal_type    = 21;
        bool default_gtf_supported           = 22;
        bool suspend_supported               = 23;
        bool standby_supported               = 24;
        bool active_off_supported            = 25;
        bool preferred_timing_mode_supported = 26;
        bool srgb_supported                  = 27;
        repeated Timing timings              = 28;
    }

    repeated Monitor monitor = 1;
}

message PowerOptions
{
    enum PowerSource
    {
        POWER_SOURCE_UNKNOWN    = 0;
        POWER_SOURCE_DC_BATTERY = 1;
        POWER_SOURCE_AC_LINE    = 2;
    }

    enum BatteryStatus
    {
        BATTERY_STATUS_UNKNOWN    = 0;
        BATTERY_STATUS_HIGH       = 1;
        BATTERY_STATUS_LOW        = 2;
        BATTERY_STATUS_CRITICAL   = 3;
        BATTERY_STATUS_CHARGING   = 4;
        BATTERY_STATUS_NO_BATTERY = 5;
    }

    message Battery
    {
        enum State
        {
            STATE_UNKNOWN      = 0;
            STATE_CHARGING     = 1;
            STATE_CRITICAL     = 2;
            STATE_DISCHARGING  = 4;
            STATE_POWER_ONLINE = 8;
        }

        string device_name           = 1;
        string manufacturer          = 2;
        string manufacture_date      = 3;
        string unique_id             = 4;
        string serial_number         = 5;
        string temperature           = 6;
        uint32 design_capacity       = 7;
        string type                  = 8;
        uint32 full_charged_capacity = 9;
        uint32 depreciation          = 10;
        uint32 current_capacity      = 11;
        uint32 voltage               = 12;
        uint32 state                 = 13;
    }

    PowerSource power_source          = 1;
    BatteryStatus battery_status      = 2;
    uint64 full_battery_life_time      = 3;
    uint64 remaining_battery_life_time = 4;
    uint32 battery_life_percent        = 5;
    repeated Battery battery          = 6;
}

message Drivers
{
    message Driver
    {
        enum Status
        {
            STATUS_UNKNOWN          = 0;
            STATUS_CONTINUE_PENDING = 1;
            STATUS_PAUSE_PENDING    = 2;
            STATUS_PAUSED           = 3;
            STATUS_RUNNING          = 4;
            STATUS_START_PENDING    = 5;
            STATUS_STOP_PENDING     = 6;
            STATUS_STOPPED          = 7;
        }

        enum StartupType
        {
            STARTUP_TYPE_UNKNOWN      = 0;
            STARTUP_TYPE_AUTO_START   = 1;
            STARTUP_TYPE_DEMAND_START = 2;
            STARTUP_TYPE_DISABLED     = 3;
            STARTUP_TYPE_BOOT_START   = 4;
            STARTUP_TYPE_SYSTEM_START = 5;
        }

        string name              = 1;
        string display_name      = 2;
        string description       = 3;
        Status status            = 4;
        StartupType startup_type = 5;
        string binary_path       = 6;
    }

    repeated Driver driver = 1;
}

message Services
{
    message Service
    {
        enum Status
        {
            STATUS_UNKNOWN          = 0;
            STATUS_CONTINUE_PENDING = 1;
            STATUS_PAUSE_PENDING    = 2;
            STATUS_PAUSED           = 3;
            STATUS_RUNNING          = 4;
            STATUS_START_PENDING    = 5;
            STATUS_STOP_PENDING     = 6;
            STATUS_STOPPED          = 7;
        }

        enum StartupType
        {
            STARTUP_TYPE_UNKNOWN      = 0;
            STARTUP_TYPE_AUTO_START   = 1;
            STARTUP_TYPE_DEMAND_START = 2;
            STARTUP_TYPE_DISABLED     = 3;
            STARTUP_TYPE_BOOT_START   = 4;
            STARTUP_TYPE_SYSTEM_START = 5;
        }

        string name              = 1;
        string display_name      = 2;
        string description       = 3;
        Status status            = 4;
        StartupType startup_type = 5;
        string binary_path       = 6;
        string start_name        = 7;
    }

    repeated Service service = 1;
}

message EnvironmentVariables
{
    message Variable
    {
        string name  = 1;
        string value = 2;
    }

    repeated Variable variable = 1;
}

message EventLogs
{
    message Event
    {
        enum Type
        {
            TYPE_UNKNOWN     = 0;
            TYPE_APPLICATION = 1;
            TYPE_SECURITY    = 2;
            TYPE_SYSTEM      = 3;
        }

        enum Level
        {
            LEVEL_UNKNOWN       = 0;
            LEVEL_SUCCESS       = 1;
            LEVEL_INFORMATION   = 2;
            LEVEL_WARNING       = 4;
            LEVEL_ERROR         = 8;
            LEVEL_AUDIT_SUCCESS = 16;
            LEVEL_AUDIT_FAILURE = 32;
        }

        Level level        = 1;
        int64 time         = 2;
        uint32 event_id    = 3;
        string source      = 4;
        string description = 5;
    }

    Event.Type type = 1;
    repeated Event event = 2;
    bytes first_cursor = 3;
    bytes last_cursor = 4;
    bool at_newest = 5;
    bool at_oldest = 6;
}

message EventLogsData
{
    enum Direction
    {
        DIRECTION_OLDER = 0;
        DIRECTION_NEWER = 1;
    }

    EventLogs.Event.Type type = 1;
    uint32 record_count = 2;
    bytes cursor = 3;
    Direction direction = 4;
}

message Routes
{
    message Route
    {
        string destonation = 1;
        string mask        = 2;
        string gateway     = 3;
        uint32 metric      = 4;
    }

    repeated Route route = 1;
}

message Connections
{
    message Connection
    {
        string process_name   = 1;
        string protocol       = 2;
        string local_address  = 3;
        string remote_address = 4;
        uint32 local_port     = 5;
        uint32 remote_port    = 6;
        string state          = 7;
    }

    repeated Connection connection = 1;
}

message Licenses
{
    message License
    {
        message Field
        {
            enum Type
            {
                TYPE_UNKNOWN         = 0;
                TYPE_OWNER           = 2;
                TYPE_ORGANIZATION    = 3;
                TYPE_PRODUCT_KEY     = 4;
                TYPE_PRODUCT_ID      = 5;
                TYPE_LICENSE_VERSION = 6;
                TYPE_LICENSE_TYPE    = 7;
            }

            Type type    = 1;
            string value = 2;
        }

        string product_name  = 1;
        repeated Field field = 2;
    }

    repeated License license = 1;
}

message Applications
{
    message Application
    {
        string name      = 1;
        string version   = 2;
        string publisher = 3;
    }

    repeated Application application = 1;
}

message OpenFiles
{
    message OpenFile
    {
        uint32 id         = 1;
        string user_name  = 2;
        uint32 lock_count = 3;
        string file_path  = 4;
    }

    repeated OpenFile open_file = 1;
}

message LocalUsers
{
    message LocalUser
    {
        message LocalUserGroup
        {
            string name = 1;
        }

        string name                   = 1;
        string full_name              = 2;
        string home_dir               = 3;
        repeated LocalUserGroup group = 4;
        bool disabled                 = 5;
        bool password_expired         = 6;
        bool dont_expire_password     = 7;
        uint64 last_logon_time        = 8;
    }

    repeated LocalUser local_user = 1;
}

message LocalUserGroups
{
    message LocalUserGroup
    {
        string name = 1;
    }

    repeated LocalUserGroup local_user_group = 1;
}

message Processes
{
    message Process
    {
        string name  = 1;
        uint32 pid   = 2;
        uint32 sid   = 3;
        string user  = 4;
        string path  = 5;
        int64 memory = 6;
    }

    repeated Process process = 1;
}

message Dmi
{
    message Bios
    {
        string vendor            = 1;
        string version           = 2;
        string release_date      = 3;
        uint32 address           = 4;
        uint64 rom_size          = 5;
        string revision          = 6;
        string firmware_revision = 7;

        repeated string characteristic = 8;
    }

    message Baseboard
    {
        string manufacturer          = 1;
        string product               = 2;
        string version               = 3;
        string serial_number         = 4;
        string asset_tag             = 5;
        string location              = 6;
        string type                  = 7;
        bool hosting_board           = 8;
        bool requires_daughter_board = 9;
        bool removable               = 10;
        bool replaceable             = 11;
        bool hot_swappable           = 12;
    }

    message Chassis
    {
        string manufacturer       = 1;
        string version            = 2;
        string serial_number      = 3;
        string asset_tag          = 4;
        string sku_number         = 5;
        string type               = 6;
        string boot_up_state      = 7;
        string power_supply_state = 8;
        string thermal_state      = 9;
        string security_status    = 10;
        bool lock_present         = 11;
        uint32 height             = 12;
        uint32 power_cords        = 13;
    }

    message Processor
    {
        bool populated                       = 1;
        string manufacturer                  = 2;
        string version                       = 3;
        string family                        = 4;
        string type                          = 5;
        string status                        = 6;
        string socket_designation            = 7;
        string socket                        = 8;
        string socket_type                   = 9;
        string serial_number                 = 10;
        string asset_tag                     = 11;
        string part_number                   = 12;
        uint64 id                            = 13;
        double voltage                       = 14;
        uint32 external_clock                = 15;
        uint32 max_speed                     = 16;
        uint32 current_speed                 = 17;
        uint32 core_count                    = 18;
        uint32 core_enabled                  = 19;
        uint32 thread_count                  = 20;
        uint32 thread_enabled                = 21;
        bool support_64bit                   = 22;
        bool support_multi_core              = 23;
        bool support_hardware_thread         = 24;
        bool support_execute_protection      = 25;
        bool support_enhanced_virtualization = 26;
        bool support_power_control           = 27;
    }

    message Cache
    {
        string designation           = 1;
        string location              = 2;
        string mode                  = 3;
        string type                  = 4;
        string sram_type             = 5;
        string supported_sram_type   = 6;
        string error_correction_type = 7;
        string associativity         = 8;
        uint32 level                 = 9;
        uint64 max_size              = 10;
        uint64 current_size          = 11;
        uint32 speed                 = 12;
        bool enabled                 = 13;
        bool socketed                = 14;
    }

    message PortConnector
    {
        string internal_designator     = 1;
        string internal_connector_type = 2;
        string external_designator     = 3;
        string external_connector_type = 4;
        string type                    = 5;
    }

    message SystemSlot
    {
        string designation        = 1;
        string type               = 2;
        string data_bus_width     = 3;
        string usage              = 4;
        string length             = 5;
        string bus_address        = 6;
        uint32 id                 = 7;
        bool provides_5_volts     = 8;
        bool provides_3_volts     = 9;
        bool shared               = 10;
        bool supports_pme         = 11;
        bool supports_hot_plug    = 12;
        bool supports_smbus       = 13;
        bool supports_bifurcation = 14;
    }

    message OnBoardDevice
    {
        string description = 1;
        string type        = 2;
        string bus_address = 3;
        uint32 instance    = 4;
        bool enabled       = 5;
    }

    message MemoryArray
    {
        string location         = 1;
        string use              = 2;
        string error_correction = 3;
        uint64 max_capacity     = 4;
        uint32 device_count     = 5;
    }

    message MemoryDevice
    {
        bool present              = 1;
        string location           = 2;
        string bank               = 3;
        string manufacturer       = 4;
        string serial_number      = 5;
        string asset_tag          = 6;
        string part_number        = 7;
        string firmware_version   = 8;
        uint64 size               = 9;
        string type               = 10;
        string type_detail        = 11;
        string form_factor        = 12;
        string technology         = 13;
        uint32 speed              = 14;
        uint32 configured_speed   = 15;
        uint32 total_width        = 16;
        uint32 data_width         = 17;
        uint32 rank               = 18;
        uint32 min_voltage        = 19;
        uint32 max_voltage        = 20;
        uint32 configured_voltage = 21;
        uint64 non_volatile_size  = 22;
        uint64 volatile_size      = 23;
        uint64 cache_size         = 24;
        uint64 logical_size       = 25;
    }

    message MemoryError
    {
        string type           = 1;
        string granularity    = 2;
        string operation      = 3;
        uint32 syndrome       = 4;
        uint64 array_address  = 5;
        uint64 device_address = 6;
        uint64 resolution     = 7;
    }

    message MemoryArrayAddress
    {
        string array           = 1;
        uint64 start_address   = 2;
        uint64 end_address     = 3;
        uint64 size            = 4;
        uint32 partition_width = 5;
    }

    message MemoryDeviceAddress
    {
        string device              = 1;
        uint64 start_address       = 2;
        uint64 end_address         = 3;
        uint64 size                = 4;
        uint32 row_position        = 5;
        uint32 interleave_position = 6;
        uint32 interleave_depth    = 7;
    }

    message Probe
    {
        string description  = 1;
        string location     = 2;
        string status       = 3;
        int32 max_value     = 4;
        int32 min_value     = 5;
        int32 nominal_value = 6;
        int32 tolerance     = 7;
        int32 resolution    = 8;
        int32 accuracy      = 9;
    }

    message CoolingDevice
    {
        string description   = 1;
        string type          = 2;
        string status        = 3;
        uint32 unit_group    = 4;
        uint32 nominal_speed = 5;
    }

    message Misc
    {
        string smbios_version  = 1;
        uint32 structure_count = 2;
        uint32 structure_size  = 3;
    }

    message TpmDevice
    {
        string vendor_id              = 1;
        string spec_version           = 2;
        string firmware_version       = 3;
        string description            = 4;
        bool configurable_by_firmware = 5;
        bool configurable_by_software = 6;
        bool configurable_by_oem      = 7;
    }

    repeated Bios bios                                 = 1;
    repeated Baseboard baseboard                       = 2;
    repeated Chassis chassis                           = 3;
    repeated Processor processor                       = 4;
    repeated Cache cache                               = 5;
    repeated PortConnector port_connector              = 6;
    repeated SystemSlot system_slot                    = 7;
    repeated OnBoardDevice on_board_device             = 8;
    repeated string oem_string                         = 9;
    repeated string configuration_option               = 10;
    repeated MemoryArray memory_array                  = 11;
    repeated MemoryDevice memory_device                = 12;
    repeated MemoryError memory_error                  = 13;
    repeated MemoryArrayAddress memory_array_address   = 14;
    repeated MemoryDeviceAddress memory_device_address = 15;
    repeated Probe voltage_probe                       = 16;
    repeated CoolingDevice cooling_device              = 17;
    repeated Probe temperature_probe                   = 18;
    repeated Probe current_probe                       = 19;
    string boot_status                                 = 20;
    repeated TpmDevice tpm_device                      = 21;
    Misc misc                                          = 22;
}

message SystemInfoRequest
{
    string category = 1;
    // Fields 2 - 10: Reserved.
    EventLogsData event_logs_data = 11;
}

message SystemInfoHeader
{
    string category = 1;
}

message SystemInfo
{
    SystemInfoHeader header           = 1;
    Computer computer                 = 2;
    OperatingSystem operating_system  = 3;
    Processor processor               = 4;
    LogicalDrives logical_drives      = 5;
    Printers printers                 = 6;
    NetworkAdapters network_adapters  = 7;
    NetworkShares network_shares      = 8;
    WindowsDevices windows_devices    = 9;
    VideoAdapters video_adapters      = 10;
    Monitors monitors                 = 11;
    PowerOptions power_options        = 12;
    Drivers drivers                   = 13;
    Services services                 = 14;
    EnvironmentVariables env_vars     = 15;
    EventLogs event_logs              = 16;
    Routes routes                     = 17;
    Connections connections           = 18;
    Licenses licenses                 = 19;
    Applications applications         = 20;
    OpenFiles open_files              = 21;
    LocalUsers local_users            = 22;
    LocalUserGroups local_user_groups = 23;
    Processes processes               = 24;
    PhysicalDrives physical_drives    = 25;
    Dmi dmi                           = 26;
}
