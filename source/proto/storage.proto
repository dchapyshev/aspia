syntax = "proto3";

option optimize_for = LITE_RUNTIME;

package proto.storage;

// The encrypted column of a host record.
message HostBlob
{
    string address  = 1;
    string username = 2;
    string password = 3;
}

// The encrypted column of a router record.
message RouterBlob
{
    string address     = 1;
    string username    = 2;
    string password    = 3;
    bytes device_token = 4;
}

// The exported backup. |data| and |verifier| are sealed with a key derived from |salt| and the
// password of the backup. |verifier| tells a wrong password from a damaged file.
message BackupFile
{
    // The identifiers are the ones of the source database. The import uses them only to rebuild
    // the tree and the links, and gives every record an id of its own.
    message Router
    {
        int64 id            = 1;
        string guid         = 2;
        string display_name = 3;
        string address      = 4;
        uint32 session_type = 5;
        string username     = 6;
        string password     = 7;
    }

    // The credentials the user saved for a host of a router.
    message RouterHost
    {
        int64 router_id = 1;
        uint64 host_id  = 2;
        string username = 3;
        string password = 4;
    }

    message LocalGroup
    {
        int64 id        = 1;
        string guid     = 2;
        int64 parent_id = 3;
        string name     = 4;
        string comment  = 5;
    }

    message LocalHost
    {
        string guid        = 1;
        int64 group_id     = 2;
        int64 router_id    = 3;
        string name        = 4;
        string comment     = 5;
        string address     = 6;
        string username    = 7;
        string password    = 8;
        int64 create_time  = 9;
        int64 modify_time  = 10;
        int64 connect_time = 11;
    }

    // What |data| holds once opened. The device token is not exported: it is bound to the user and
    // the machine that got it.
    message Content
    {
        repeated Router routers          = 1;
        repeated RouterHost router_hosts = 2;
        repeated LocalGroup local_groups = 3;
        repeated LocalHost local_hosts   = 4;
    }

    uint32 version = 1;
    bytes salt     = 2;
    bytes verifier = 3;
    bytes data     = 4;
}
