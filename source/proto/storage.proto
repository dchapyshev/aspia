syntax = "proto3";

option optimize_for = LITE_RUNTIME;

import "desktop_control.proto";

package proto.storage;

message HostBlob
{
    string address  = 1;
    string username = 2;
    string password = 3;
}

message CredentialBlob
{
    string username    = 2;
    string password    = 3;
    bytes unknown_data = 4;
}

message RouterBlob
{
    message Sync
    {
        bool enabled               = 1;
        bytes storage_id           = 2;
        bytes storage_key          = 3;
        bool storage_reset_pending = 4;
    }

    string address      = 1;
    string username     = 2;
    string password     = 3;
    bytes device_token  = 4;
    uint32 session_type = 5;
    bool enabled        = 6;
    string user_guid    = 7;
    Sync sync           = 8;
}

message ProxyBlob
{
    bool enabled    = 1;
    uint32 type     = 2;
    string address  = 3;
    uint32 port     = 4;
    string username = 5;
    string password = 6;
}

message ProfileData
{
    uint32 udp_methods     = 1;
    control.Config desktop = 2;
}

message BackupFile
{
    message Router
    {
        string address      = 1;
        uint32 session_type = 2;
        string username     = 3;
        string password     = 4;
        bool enabled        = 5;
    }

    message RouterHost
    {
        uint64 host_id            = 1;
        string username           = 2;
        string password           = 3;
        string credential_guid    = 4;
        string os_credential_guid = 5;
        string profile_guid       = 6;
    }

    message LocalGroup
    {
        string guid        = 1;
        string parent_guid = 2;
        string name        = 3;
        string comment     = 4;
    }

    message LocalHost
    {
        string guid               = 1;
        string group_guid         = 2;
        string name               = 3;
        string comment            = 4;
        string address            = 5;
        string username           = 6;
        string password           = 7;
        int64 create_time         = 8;
        int64 modify_time         = 9;
        int64 connect_time        = 10;
        string credential_guid    = 11;
        string os_credential_guid = 12;
        string profile_guid       = 13;
    }

    message Credential
    {
        string guid         = 1;
        uint32 type         = 2;
        string display_name = 3;
        string username     = 4;
        string password     = 5;
    }

    message Profile
    {
        string guid            = 1;
        string name            = 2;
        uint32 udp_methods     = 3;
        control.Config desktop = 4;
    }

    message Content
    {
        Router router                    = 1;
        repeated RouterHost router_hosts = 2;
        repeated LocalGroup local_groups = 3;
        repeated LocalHost local_hosts   = 4;
        repeated Credential credentials  = 5;
        repeated Profile profiles        = 6;
    }

    uint32 version = 1;
    bytes salt     = 2;
    bytes verifier = 3;
    bytes data     = 4;
}

message CredentialFile
{
    message Credential
    {
        string guid         = 1;
        uint32 type         = 2;
        string display_name = 3;
        string username     = 4;
        string password     = 5;
    }

    message Content
    {
        repeated Credential credentials = 1;
    }

    bytes salt     = 1;
    bytes verifier = 2;
    bytes data     = 3;
    uint32 version = 4;
}
