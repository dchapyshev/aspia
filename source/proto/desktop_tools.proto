syntax = "proto3";

option optimize_for = LITE_RUNTIME;

package proto.tools;

message Tool
{
    int32 id    = 1;
    string name = 2;
    bytes icon  = 3;
}

message Script
{
    int32 id           = 1;
    string name        = 2;
    string description = 3;
    bool confirm       = 4;
}

message ToolList
{
    repeated Tool tool     = 1;
    repeated Script script = 2;
}

message ToolListRequest
{
    uint32 dummy = 1; // Always set to 1.
}

message ExecuteTool
{
    int32 id = 1;
}

message ExecuteScript
{
    int32 id = 1;
}

// Client -> Host (channel 12).
message ClientToHost
{
    ToolListRequest tool_list_request = 1;
    ExecuteTool execute_tool          = 2;
    ExecuteScript execute_script      = 3;
}

// Client <- Host (channel 12).
message HostToClient
{
    ToolList tool_list = 1;
}
