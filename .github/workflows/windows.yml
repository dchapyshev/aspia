name: windows

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'LICENSE.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}/builds/ci/vcpkg_installed
  VCPKG_BINARY_SOURCES: 'default,readwrite'

jobs:
  build-all-matrix:
    name: ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push'
    strategy:
      fail-fast: true
      matrix:
        os: [win11]
        arch: [x86, x64]
        build_type: [release, debug]
        include:
          - os: win11
            arch: x86
            triplet: x86-windows-static
            msvc_arch: amd64_x86
          - os: win11
            arch: x64
            triplet: x64-windows-static
            msvc_arch: amd64

    steps:
      # Step 1
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      # Step 2
      # On Windows runners, let's ensure to have the Developer Command Prompt
      # environment setup correctly. As used here the Developer Command Prompt
      # created is targeting x86 and using the default the Windows SDK.
      - name: Set MSVC x86/x64 parameters
        uses: ilammy/msvc-dev-cmd@v1
        if: matrix.arch != 'amd64_arm64'
        with:
          arch: ${{ matrix.msvc_arch }}
          toolset: 14.44

      # Step 4
      - name: Dependencies, Build, Tests (Windows/PowerShell)
        env:
          # This vars used inside CMake
          VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg\bincache-${{ matrix.triplet }}
          VCPKG_TRIPLET: ${{ matrix.triplet }}
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.triplet }}
          VCPKG_DOWNLOADS: C:\vcpkg\downloads
        run: |
          Get-ChildItem env:

          if (!$env:VCPKG_TRIPLET) { echo "VCPKG_TRIPLET is empty"; exit 1; }

          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS

          # Build vcpkg dependencies
          cmake --preset ci

          # Build project
          cmake --build --preset ci-${{ matrix.build_type }}

          # Run tests
          ctest --preset ci-${{ matrix.build_type }}

      # Step 5
      - name: Get version
        id: version
        working-directory: ${{ github.workspace }}
        run: |
          $text = Get-Content CMakeLists.txt -Raw
          $major = [regex]::Match($text, 'set\(ASPIA_VERSION_MAJOR\s+(\d+)\)').Groups[1].Value
          $minor = [regex]::Match($text, 'set\(ASPIA_VERSION_MINOR\s+(\d+)\)').Groups[1].Value
          $patch = [regex]::Match($text, 'set\(ASPIA_VERSION_PATCH\s+(\d+)\)').Groups[1].Value
          if (!$major -or !$minor -or !$patch) { echo "version not found in CMakeLists.txt"; exit 1 }
          $line = "version=$major.$minor.$patch"
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "$line`n", [System.Text.UTF8Encoding]::new($false))

      # Step 6
      - name: Build MSI packages
        run: |
          installer/windows/build.cmd ${{ steps.version.outputs.version }} ${{ matrix.arch }} ${{ github.workspace }} ${{ github.workspace }}/builds/ci/${{ matrix.build_type }}
        shell: cmd
        working-directory: ${{ github.workspace }}

      # Step 7
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.build_type }}
          path: |
            ${{ github.workspace }}/builds/ci/${{ matrix.build_type }}/*-${{ matrix.arch }}.msi
          if-no-files-found: error
          retention-days: 7
